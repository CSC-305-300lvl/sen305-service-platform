<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found | VUA ServiceDesk</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #18212f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .error-container {
            max-width: 600px;
            padding: 2rem;
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            color: #17365d;
        }

        h2 {
            margin-top: 0.5rem;
        }

        p {
            color: #5d6776;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 1.25rem;
            background: #17365d;
            color: white;
            text-decoration: none;
            border-radius: 0.4rem;
        }

        a:hover,
        a:focus-visible {
            background: #0f2746;
        }

        a:focus-visible {
            outline: 3px solid #5d6776;
            outline-offset: 4px;
        }
    </style>
</head>

<body>

    <main class="error-container">

        <h1>404</h1>

        <h2>Page Not Found</h2>

        <p>
            Sorry, the page you are looking for does not exist
            or may have been moved.
        </p>

        <a href="/">Return to Home</a>

    </main>

</body>

</html>
